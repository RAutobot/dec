name: Names
on: workflow_dispatch

jobs:
  names:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run
        run: |
          for format in bsd darwin just-symbols posix sysv
          do
            llvm-nm-18 -D -f "$format" --defined-only *.so > "$format.txt"
          done

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: names
          path: "*.txt"
