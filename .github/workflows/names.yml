name: Names
on: workflow_dispatch
  
jobs:
  names:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run
        run: |
          llvm-nm-18 -DC *.so > demangled.txt
          llvm-nm-18 -D *.so > mangled.txt

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: names
          path: "*.txt"
