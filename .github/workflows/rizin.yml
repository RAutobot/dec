name: Rizin
on: workflow_dispatch
  
jobs:
  rizin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run
        run: docker run -v "$PWD:/pwd" --entrypoint /bin/sh rizin/rizin:latest -c "export RZ_LOGLEVEL=0; rizin -qq -c 'pd 2 @ 0x8f046c' /pwd/*.so"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: upload.c
