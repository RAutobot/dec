name: Rizin
on: workflow_dispatch
  
jobs:
  rizin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run
        run: docker run --entrypoint /bin/sh -v "$PWD:/pwd" rizin/rizin:latest -c "rizin -q -c 'aa; pdg @ 0x8f01dc' /pwd/*.so" > upload.c

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: upload.c
