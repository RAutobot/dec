name: Rizin
on: workflow_dispatch
  
jobs:
  rizin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download and run
        run: |
          curl -sSL https://github.com/rizinorg/rizin/releases/download/v0.9.1/rizin-v0.9.1-static-x86_64.tar.xz | tar -xJ -f -
          ./bin/rz-bin -s *.so > rizin.txt

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: rizin.txt
