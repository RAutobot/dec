name: Rizin
on: workflow_dispatch
  
jobs:
  rizin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run
        run: docker run -i -v "$PWD:/pwd" --entrypoint /bin/sh rizin/rizin:latest -c 'rizin -qq -e bin.strings=false -c "pd 2 @ 0x8f046c" /pwd/*.so < /dev/null'

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: upload.c
