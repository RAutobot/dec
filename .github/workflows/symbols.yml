name: Symbols
on:
  workflow_dispatch:
    inputs:
      url:
        description: URL
        required: true
  
jobs:
  symbols:
    runs-on: ubuntu-latest
    steps:
      - name: Run
        run: |
          llvm-nm-18 -D "$(curl -sSLOJ -w %{filename_effective} "${{ inputs.url }}")" > tmp
          paste -d " " tmp <(awk '{ print $NF }' tmp | llvm-cxxfilt-18) | awk '$NF == $(NF-1) { NF-- }; print $0' > symbols.txt

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: symbols
          path: symbols.txt
