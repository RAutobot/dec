name: Symbols
on:
  workflow_dispatch:
    inputs:
      url:
        description: URL
        required: true
  
jobs:
  symbols:
    runs-on: ubuntu-latest
    steps:
      - name: Run
        run: |
          llvm-nm-18 -D "$(curl -sSLOJ -w %{filename_effective} "${{ inputs.url }}")" | while read -r a b c; do
            printf "%s" "$a $b $c "
            printf "$s" | llvm-cxxfilt-18
          done > symbols.txt

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: symbols.txt
