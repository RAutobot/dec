name: Symbols
on: workflow_dispatch
  
jobs:
  symbols:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run
        run: llvm-nm-18 -f posix *.so > symbols.txt

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: symbols.txt