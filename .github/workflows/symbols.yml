name: Symbols
on:
  workflow_dispatch:
    inputs:
      url:
        description: URL
        required: true
  
jobs:
  symbols:
    runs-on: ubuntu-latest
    steps:
      - name: Run
        run: |
          llvm-nm-18 -D "$(curl -sSLOJ -w %{filename_effective} "${{ inputs.url }}")" | awk '{
            print $0, ($NF | "llvm-cxxfilt-18")
          }' > symbols.txt

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: symbols.txt
