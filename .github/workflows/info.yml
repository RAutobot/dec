name: Info
on: workflow_dispatch
  
jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - name: Run
        run: |
          zstd -qd "(curl -sSLOJ -w %{filename_effective} "${{ vars.URL }}")"

          paste -d " " <(llvm-nm-18 -DjC *.so) <(llvm-nm-18 -DP *.so) | sed -E 's/^(\S+) \1/\1/' > names.txt
          llvm-strings-18 -t x *.so | sed 's/^ +//' > strings.txt

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: info
          path: "*.txt"
