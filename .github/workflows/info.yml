name: Info
on: workflow_dispatch
  
jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - name: Run
        run: |
          filename="$(curl -sSLOJ -w %{filename_effective} "${{ vars.URL }}")"

          paste -d "" <(llvm-nm-18 -D "$filename") <(llvm-nm-18 -DjC "$filename") | sed -E '
            s/^ +//
            s/ (\S+) \1$/ \1/
          ' > names.txt
          llvm-strings-18 -t x "$filename" | sed 's/^ +//' > strings.txt

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: info
          path: "*.txt"
