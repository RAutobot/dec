name: Test
on: workflow_dispatch
  
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Run
        run: |
          unzip -q "$(curl -sSLOJ -w %{filename_effective})"
          unzip -q config.arm64_v8a.apk

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: libs
          files: lib/arm64-v8a/libil2cpp.so
