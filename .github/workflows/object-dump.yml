name: Object Dump
on:
  workflow_dispatch:
    inputs:
      symbol-name:
        description: Symbol name
        required: true
  
jobs:
  object-dump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run
        run: |
          llvm-objdump-18 -C --disassemble-symbols="${{ inputs.symbol-name }}" *.so | sed -E -e 's|\s+| |g' -e 's|^[[:xdigit:]]+ (<.+>):$|\1|' -e 's|^ [[:xdigit:]]+: [[:xdigit:]]+ ||' > object-dump.asm

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: object-dump.asm
