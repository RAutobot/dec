name: Object Dump
on:
  workflow_dispatch:
    inputs:
      mangled-names:
        description: Mangled names
        required: true

jobs:
  object-dump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run
        run: |
          llvm-objdump-18 --disassemble-symbols="${{ inputs.mangled-names }}" *.so | llvm-cxxfilt-18 | sed -E -e 's/\s+/ /g' -e 's/^[[:xdigit:]]+ (<.+>):$/\1/' -e 's/^ [[:xdigit:]]+: [[:xdigit:]]+ //' > object-dump.asm

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: object-dump.asm
