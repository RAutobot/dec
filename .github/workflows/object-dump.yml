name: Object Dump
on: workflow_dispatch
  
jobs:
  object-dump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run
        run: |
          ls -l /usr/bin/llvm-objdump*
          llvm-objdump -d -C --start-address=0x8f5bc0 --stop-address=0x914b64 *.so > upload.txt

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: upload.c
