name: Object Dump
on:
  workflow_dispatch:
    inputs:
      start-address:
        description: Start address
        required: true
      stop-address:
        description: Stop address
        required: true
  
jobs:
  object-dump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run
        run: |
          llvm-objdump-18 -dC --start-address="0x${{ inputs.start-address }}" --stop-address="0x${{ inputs.stop-address }}" *.so | sed -E -e 's|\s+| |g' -e 's|^[[:xdigit:]]+ (<.+>):$|\1|' -e 's|^ [[:xdigit:]]+: [[:xdigit:]]+ ||' > "${{ inputs.start-address }}-${{ inputs.stop-address }}.asm"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: ${{ inputs.start-address }}-${{ inputs.stop-address }}.asm
