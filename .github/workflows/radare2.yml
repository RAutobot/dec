name: Radare2
on: workflow_dispatch
  
jobs:
  radare2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install and run
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends radare2

          llvm-objdump-18 -d -C --start-address=0xaf0f90 --stop-address=0xaf0fb4 *.so > e.txt

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: archive
          path: "*.txt"
