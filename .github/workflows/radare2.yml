name: Radare2
on:
  workflow_dispatch:
    inputs:
      offset:
        description: Offset
        required: true
  
jobs:
  radare2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install and run
        if: cancelled()
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends radare2

          r2 -q -e bin.cache=true -c "aa; aar; axt @ ${{ inputs.offset }}" *.so > radare2.txt

      - name: Linear Call Search
        run: |
          # 1. Check if there are any direct branch/call instructions (bl/b) in the entire binary
          echo "=== Direct calls in code (.text) ==="
          llvm-objdump-18 -d -C *.so | grep -E "(bl|b)\s+.*Create(Stamina|HP)BarForEntity" || echo "No direct calls found."

          # 2. Check if either function address is in the Relocation Table (Vtables/Function pointers)
          echo "=== Function pointer / Vtable references (.rela.dyn) ==="
          readelf -r *.so | grep -E "Create(Stamina|HP)BarForEntity" || echo "No relocation entries found."

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: radare2.txt
