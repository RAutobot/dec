name: Radare2
on:
  workflow_dispatch:
    inputs:
      offset:
        description: Offset
        required: true
  
jobs:
  radare2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install and run
        if: cancelled()
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends radare2

          r2 -q -e bin.cache=true -c "aa; aar; axt @ ${{ inputs.offset }}" *.so > radare2.txt

      - name: Linear Call Search
        run: |
          llvm-objdump-18 -d -C --start-address=0xaea7f0 --stop-address=0xaea850 *.so

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: radare2.txt
