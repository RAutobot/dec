name: Radare2
on: workflow_dispatch
  
jobs:
  radare2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install and run
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends radare2

          r2 -q -c "aa; aac; axt sym.KosovoUIScreenInGame::CreateStaminaBarForEntity" *.so > radare2.txt

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: radare2.txt