name: Radare2
on: push
  
jobs:
  radare2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install and run
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends radare2

          llvm-objdump-18 -d -C --start-address=0xaf0f60 --stop-address=0xaf0fa8 *.so > hmm.txt

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: hmm.txt
