name: Radare2
on: push
  
jobs:
  radare2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install and run
        run: |
          #sudo apt-get update
          #sudo apt-get install -y --no-install-recommends radare2

          # 1. Inspect SetMovingFlag:
          llvm-objdump-18 -d -C *.so | grep -A 15 "<KosovoNewMovementComponent::SetMovingFlag" >> hmm.txt
          # 2. Inspect UpdateMoveMode:
          llvm-objdump-18 -d -C *.so | grep -A 20 "<KosovoNewMovementComponent::UpdateMoveMode" >> hmm.txt

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: hmm.txt
