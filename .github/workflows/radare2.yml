name: Radare2
on:
  workflow_dispatch:
    inputs:
      offset:
        description: Offset
        required: true
  
jobs:
  radare2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install and run
        if: cancelled()
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends radare2

          r2 -q -e bin.cache=true -c "aa; aar; axt @ ${{ inputs.offset }}" *.so > radare2.txt

      - name: Linear Call Search
        run: |
          # 1. See who calls UpdateUI (at address af77d0):
          echo "=== Who calls UpdateUI? ==="
          llvm-objdump-18 -d *.so | grep -E "(bl|b)\s+.*af77d0" || echo "No direct calls to UpdateUI."

          # 2. Dump the rest of UpdateUI to see how it shrinks the bar:
          echo "=== Full UpdateUI function ==="
          llvm-objdump-18 -d -C --start-address=0xaf77d0 --stop-address=0xaf7810 *.so > e.txt

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: archive
          path: "*.txt"
