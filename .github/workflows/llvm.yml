name: LLVM
on:
  workflow_dispatch:
    inputs:
      disassemble-symbols:
        description: Disassemble symbols

jobs:
  llvm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run
        run: |
          llvm-nm-18 -D -f posix *.so > nm.txt

          if [[ -n "${{ inputs.disassemble-symbols }}" ]]; then
            llvm-objdump-18 --no-show-raw-insn --disassemble-symbols="${{ inputs.disassemble-symbols }}" *.so | llvm-cxxfilt-18 | awk '{ $1=$1; gsub(/^.*<|>:$/, ""); print; }' > objdump.txt
          fi

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: nm.txt

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: objdump.txt
