name: Assembly
on:
  workflow_dispatch:
    inputs:
      url:
        description: URL
        required: true
      commands:
        description: Commands
        default: "-d --no-leading-addr --no-show-raw-insn"
        required: true

jobs:
  assembly:
    runs-on: ubuntu-latest
    steps:
      - name: Run
        run: |
          filename="$(curl -sSLOJ -w %{filename_effective} "${{ inputs.url }}")"
          llvm-objdump-18 ${{ inputs.commands }} "$filename" | llvm-cxxfilt-18 | sed -E '
            s/^[ \t]+//
            s/[ \t]+/ /g
            s/^([0-9a-fA-F]+ )?<(.+)>:$/\2/
          ' > assembly.txt

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: assembly
          path: assembly.txt
