name: Assembly
on:
  workflow_dispatch:
    inputs:
      url:
        description: URL
        required: true
      start-address:
        description: Start address
        required: true
      stop-address:
        description: Stop address
        required: true

jobs:
  assembly:
    runs-on: ubuntu-latest
    steps:
      - name: Run
        run: |
          filename="$(curl -sSLOJ -w %{filename_effective} "${{ inputs.url }}")"
          llvm-objdump-18 -d --no-leading-addr --no-show-raw-insn --start-address="0x${{ inputs.start-address }}" --stop-address="0x${{ inputs.stop-address }}" "$filename" | llvm-cxxfilt-18 | sed -E '
            s/^[[:space:]]+//
            s/[[:space:]]+/ /g
            s/<(.+)>:$/\1/
          ' > assembly.txt

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: assembly
          path: assembly.txt
