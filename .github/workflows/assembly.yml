name: Assembly
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: Symbols

jobs:
  assembly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run
        if: ${{ inputs.symbols == '' }}
        run: |
          llvm-objdump-18 -d --no-show-raw-insn *.so | llvm-cxxfilt-18 | sed -E '
            s/^[[:space:]]+//
            s/[[:space:]]+$//
            s/[[:space:]]+/ /g
            s/<(.+)>:$/\1/
          ' > assembly.txt

      - name: Run
        if: ${{ inputs.symbols != '' }}
        run: |
          llvm-objdump-18 --no-leading-addr --no-show-raw-insn --disassemble-symbols="${{ inputs.symbols }}" *.so | llvm-cxxfilt-18 | sed -E '
            s/^[[:space:]]+//
            s/[[:space:]]+$//
            s/[[:space:]]+/ /g
            s/<(.+)>:$/\1/
          ' > assembly.txt

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: assembly
          path: assembly.txt
