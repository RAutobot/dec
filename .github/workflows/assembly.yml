name: Assembly
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: Symbols
        required: true

jobs:
  assembly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run
        run: |
          llvm-objdump-18 --no-leading-addr --no-show-raw-insn --disassemble-symbols="${{ inputs.symbols }}" *.so | sed -E '
            s/^[[:space:]]+//
            s/[[:space:]]+$//
            s/[[:space:]]+/ /g
            s/<(.+)>:$/\1/
          ' | llvm-cxxfilt-18 > assembly.txt

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: assembly.txt
